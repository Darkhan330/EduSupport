<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index2.css') }}">
    <script src="{{ url_for('static', filename='index3.js') }}" defer></script>
    <title>Forgot Password - EduSupport</title>
</head>
<body>
    <video autoplay muted loop playsinline class="background-video">
        <source src="{{ url_for('static', filename='6266-190550868_medium.mp4') }}" type="video/mp4">
    </video>

    <form class="border" method="post" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="centralized-card">
            <h1>Reset Password</h1>
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="form-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}
            <p class="hint">Enter your login or email to receive recovery instructions.</p>
            <div>
                <input type="text" name="login" placeholder="Login or Email" class="Log_pas" required>
                <button type="submit" class="Log_pas submit-btn">Send Request</button>
            </div>
            <div class="reg_for">
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </div>
    </form>
</body>
</html>

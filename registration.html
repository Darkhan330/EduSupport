<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index2.css') }}">
    <script src="{{ url_for('static', filename='index3.js') }}" defer></script>
    <title>Registration - EduSupport</title>
</head>
<body>
    <video autoplay muted loop playsinline class="background-video">
        <source src="{{ url_for('static', filename='6266-190550868_medium.mp4') }}" type="video/mp4">
    </video>

    <form class="border" method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="centralized-card">
            <h1>Create Account</h1>
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="form-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}
            <div>
                <input type="text" name="full_name" placeholder="Full Name" class="Log_pas" required maxlength="100">
                <input type="text" name="login" placeholder="Login / Email" class="Log_pas" required maxlength="100" autocomplete="username">
                <input type="password" name="password" placeholder="Password (min. 8 characters)" class="Log_pas" required minlength="8" autocomplete="new-password">
                <input type="password" name="confirm_password" placeholder="Confirm Password" class="Log_pas" required minlength="8" autocomplete="new-password">
                <select name="role" class="Log_pas">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
                <button type="submit" class="Log_pas submit-btn">Sign Up</button>
            </div>
            <div class="reg_for">
                <a href="{{ url_for('login') }}">Already have an account? Log in</a>
            </div>
        </div>
    </form>
</body>
</html>
